<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAC | Advanced Cipher Suite</title>
    <link rel="stylesheet" href="styles/styles.css">
    <style>
        .cipher-box {
            background: rgba(2, 103, 193, 0.05);
            border: 2px solid #D65108;
            padding: 25px;
            border-radius: 4px;
            max-width: 600px;
            margin: 20px auto;
        }

        .module-header {
            color: #D65108;
            font-family: 'Courier New', monospace;
            border-bottom: 1px solid rgba(214, 81, 8, 0.3);
            margin-bottom: 15px;
            padding-bottom: 5px;
            font-weight: bold;
        }

        .input-group { margin-bottom: 15px; text-align: left; }

        label {
            display: block;
            color: #0267C1;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.85rem;
        }

        .mode-switch { display: flex; gap: 8px; margin-bottom: 15px; }

        .mode-btn {
            flex: 1;
            padding: 8px;
            background: #FDFCF0;
            border: 1px solid #0267C1;
            color: #591F0A;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
        }

        .mode-btn.active { background: #0267C1; color: #FDFCF0; }

        select, textarea {
            width: 100%;
            background: #FDFCF0;
            border: 1px solid #0267C1;
            color: #591F0A;
            font-family: 'Courier New', monospace;
            padding: 10px;
        }

        .output-area {
            background: #000;
            color: #4ade80;
            padding: 12px;
            min-height: 60px;
            border: 1px solid #591F0A;
            border-radius: 4px;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="classification-banner">
        TOP SECRET<span class="compartment">// SI-TK // NOFORN</span>
    </div>

    <div class="terminal-container">
        <header class="terminal-header">
            <h1>Cipher Suite v1.8</h1>
        </header>

        <main>
            <div class="cipher-box">
                <div class="module-header">// CIPHER: CAESAR_SHIFT</div>
                <div class="mode-switch">
                    <button id="caeEncBtn" class="mode-btn active" onclick="setCaesarMode('encrypt')">ENCRYPT</button>
                    <button id="caeDecBtn" class="mode-btn" onclick="setCaesarMode('decrypt')">DECRYPT</button>
                </div>
                <div class="input-group">
                    <label>SHIFT START (A = ?)</label>
                    <select id="caesarShift" onchange="runCaesar()">
                        <script>
                            const alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                            for(let i=0; i<26; i++) document.write(`<option value="${i}">A ➔ ${alpha[i]}</option>`);
                        </script>
                    </select>
                </div>
                <div class="input-group">
                    <label>INPUT DATA</label>
                    <textarea id="caesarInput" rows="2" placeholder="TYPE HERE..." oninput="runCaesar()"></textarea>
                </div>
                <div class="output-area" id="caesarOutput">WAITING...</div>
            </div>

            <div class="cipher-box">
                <div class="module-header">// CIPHER: A1Z26_CODEX</div>
                <div class="mode-switch">
                    <button id="a1zEncBtn" class="mode-btn active" onclick="setA1Z26Mode('encrypt')">LETTERS ➔ NUMBERS</button>
                    <button id="a1zDecBtn" class="mode-btn" onclick="setA1Z26Mode('decrypt')">NUMBERS ➔ LETTERS</button>
                </div>
                <div class="input-group">
                    <label>INPUT DATA</label>
                    <textarea id="a1zInput" rows="2" placeholder="TYPE HERE..." oninput="runA1Z26()"></textarea>
                </div>
                <div class="output-area" id="a1zOutput">WAITING...</div>
            </div>

            <div class="action-bar">
                <a href="/for_fun/dashboard.html" class="btn">Return to Dashboard</a>
            </div>
        <footer>
            <p>PROPERTY OF THE JOINT ADVENTURE COMMAND // UNAUTHORIZED ACCESS PROHIBITED // 2026</p>
        </footer>
        </main>
    </div>

    <script>
        // --- CAESAR LOGIC ---
        let caeMode = 'encrypt';
        function setCaesarMode(m) { caeMode = m; document.getElementById('caeEncBtn').classList.toggle('active', m==='encrypt'); document.getElementById('caeDecBtn').classList.toggle('active', m==='decrypt'); runCaesar(); }
        
        function runCaesar() {
            const input = document.getElementById('caesarInput').value.toUpperCase();
            let shift = parseInt(document.getElementById('caesarShift').value);
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if (!input) { document.getElementById('caesarOutput').innerText = "WAITING..."; return; }
            if (caeMode === 'decrypt') shift = (26 - shift) % 26;
            
            let res = "";
            for (let char of input) {
                let idx = alphabet.indexOf(char);
                res += (idx === -1) ? char : alphabet[(idx + shift) % 26];
            }
            document.getElementById('caesarOutput').innerText = res;
        }

        // --- A1Z26 LOGIC ---
        let a1zMode = 'encrypt';
        function setA1Z26Mode(m) { a1zMode = m; document.getElementById('a1zEncBtn').classList.toggle('active', m==='encrypt'); document.getElementById('a1zDecBtn').classList.toggle('active', m==='decrypt'); runA1Z26(); }

        function runA1Z26() {
            const input = document.getElementById('a1zInput').value.trim().toUpperCase();
            const output = document.getElementById('a1zOutput');
            if (!input) { output.innerText = "WAITING..."; return; }

            if (a1zMode === 'encrypt') {
                // Letter to Number (BEND -> 2-5-14-4)
                let res = [];
                for (let char of input) {
                    let code = char.charCodeAt(0);
                    if (code >= 65 && code <= 90) res.push(code - 64);
                    else res.push(char);
                }
                output.innerText = res.join('');
            } else {
                // Number to Letter (2-5-14-4 -> BEND)
                let res = "";
                let parts = input.split(/[- ]+/);
                for (let p of parts) {
                    let num = parseInt(p);
                    if (!isNaN(num) && num >= 1 && num <= 26) res += String.fromCharCode(num + 64);
                    else res += p;
                }
                output.innerText = res;
            }
        }
    </script>
</body>
</html>
