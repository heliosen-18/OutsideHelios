<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A1Z26 Decoder</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        #output { padding: 15px; background: #f4f4f4; border-radius: 5px; min-height: 50px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>A1Z26 Decoder</h2>
    <p>Enter numbers separated by spaces, dashes, or commas (e.g., <code>8 5 12 12 15</code>):</p>
    
    <textarea id="inputBox" placeholder="Type numbers here..."></textarea>
    
    <div id="output">Your decoded message will appear here...</div>

    <script>
        const input = document.getElementById('inputBox');
        const output = document.getElementById('output');

        input.addEventListener('input', () => {
            const rawValue = input.value;
            
            // 1. Split the string by any non-digit character (space, dash, comma)
            const numbers = rawValue.split(/[^0-9]+/);
            
            // 2. Map through numbers and convert to letters
            const decoded = numbers
                .map(num => {
                    let n = parseInt(num);
                    if (n >= 1 && n <= 26) {
                        return String.fromCharCode(n + 64); // 64 + 1 = 'A'
                    }
                    return ''; // Ignore invalid numbers
                })
                .join('');

            output.innerText = decoded || "Waiting for valid numbers...";
        });
    </script>
</body>
</html>
