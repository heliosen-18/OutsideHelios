<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OHNet | Decoder</title>
    <link rel="stylesheet" href="styles/styles.css">
        <link rel="icon" type="image/png" href="/logo/Asset_1.png">
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        textarea { width: 75%; height: 100px; margin-bottom: 10px; }
        #output { padding: 15px; background: grey; border-radius: 5px; min-height: 50px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="terminal-container">
        <h2 class="logo">A1Z26 SIGNAL DECODER</h2>
        <p>ENTER NUMERIC FREQUENCY:</p>
        
        <input type="text" id="numeric-input" placeholder="e.g. 1 12 1 19 11 1" 
            style="background: #000; color: #0267C1; border: 1px solid #591F0A; padding: 10px; width: 80%;">
        
        <button onclick="decryptSignal()" class="cta-button" style="margin-top: 10px;">DECRYPT SIGNAL</button>
        
        <div id="decoded-output" class="code-window" style="margin-top: 20px; height: 50px; display: none;">
            </div>
    </div>
    <div class="terminal-container">
        <h2 class="logo">A1Z26 SIGNAL ENCODER</h2>
        <p>ENTER TEXT TO ENCRYPT (Letters only):</p>
        
        <input type="text" id="text-input" placeholder="e.g. ALASKA" 
            style="background: #000; color: #EFA00B; border: 1px solid #591F0A; padding: 10px; width: 80%; text-transform: uppercase;">
        
        <button onclick="encryptSignal()" class="cta-button" style="margin-top: 10px;">ENCODE SIGNAL</button>
        
        <div id="encoded-output" class="code-window" style="margin-top: 20px; height: 50px; display: none;">
            </div>
    </div>
    <script>
        function decryptSignal() {
            const input = document.getElementById('numeric-input').value;
            const outputDiv = document.getElementById('decoded-output');
            
            // Split the input by dashes or spaces
            const numberArray = input.split(/[- ]+/);
            
            // Convert numbers to letters
            const decryptedMessage = numberArray.map(num => {
                const n = parseInt(num);
                if (n >= 1 && n <= 26) {
                    // 64 is the offset for Uppercase A in ASCII (64 + 1 = 65, which is 'A')
                    return String.fromCharCode(64 + n);
                }
                return ''; // Ignore invalid numbers
            }).join('');

            // Display the result
            if (decryptedMessage) {
                outputDiv.style.display = 'block';
                outputDiv.innerHTML = `> DECRYPTED MESSAGE: ${decryptedMessage}`;
            }
        }
        function encryptSignal() {
            const input = document.getElementById('text-input').value.toUpperCase();
            const outputDiv = document.getElementById('encoded-output');
            
            // Remove everything that isn't a letter
            const cleanInput = input.replace(/[^A-Z]/g, '');
            
            const encodedArray = [];
            for (let i = 0; i < cleanInput.length; i++) {
                // charCodeAt(0) returns the ASCII value (A = 65)
                const num = cleanInput.charCodeAt(i) - 64;
                encodedArray.push(num);
            }

            const finalCode = encodedArray.join('');

            // Display the result
            if (finalCode) {
                outputDiv.style.display = 'block';
                outputDiv.innerHTML = `> ENCODED FREQUENCY: ${finalCode}`;
            }
        }
    </script>
</body>
</html>
